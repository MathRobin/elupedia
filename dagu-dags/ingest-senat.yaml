# Généré automatiquement à partir de .github/workflows/ingest-senat.yml
# Cron repris tel quel (UTC — GitHub Actions n'exécute qu'en UTC).
# Vérifier que Dagu/systemd interprète bien ce cron en UTC (TZ=UTC),
# sinon les horaires réels seront décalés par rapport au calendrier
# documenté dans docs/INGESTION-SCHEDULE.md.
name: Ingest — Sénat
schedule: '30 1 * * 2'
env:
  - DATABASE_URL: ${DATABASE_URL}
steps:
  - name: git-pull
    command: git pull
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: ingestion-senat
    command: yarn --cwd packages/ingest ingest:senat
    depends:
      - install-dependencies
  # Les nouveaux élus publiés par le Sénat sans date de naissance, ou déjà
  # connus de l'AN (jeu AMO30), peuvent recréer une fiche en doublon :
  # fusion idempotente en fin de run (voir docs/INGEST.md).
  - name: merge-duplicate-officials
    command: yarn --cwd packages/ingest merge:duplicate-officials --apply
    depends:
      - ingestion-senat
