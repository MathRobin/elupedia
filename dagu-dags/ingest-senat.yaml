# Généré automatiquement à partir de .github/workflows/ingest-senat.yml
# Cron repris tel quel (UTC — GitHub Actions n'exécute qu'en UTC).
# Vérifier que Dagu/systemd interprète bien ce cron en UTC (TZ=UTC),
# sinon les horaires réels seront décalés par rapport au calendrier
# documenté dans docs/INGESTION-SCHEDULE.md.
name: ingest-senat
description: Ingest — Sénat
schedule: '30 1 * * 2'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock sh -c 'git fetch --no-write-fetch-head origin main && git merge --ff-only origin/main'
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: ingestion-senat
    command: yarn --cwd packages/ingest ingest:senat
    depends:
      - install-dependencies
  # Une même personne peut recevoir deux fiches `officials` quand une seconde
  # source la crée avant que le rapprochement nom + date de naissance joue.
  # Ce rapprochement n'a lieu qu'à la création, donc les doublons anciens ne se
  # résorbent jamais : cette étape les recense en fin de run, pour qu'ils
  # apparaissent dans les logs Dagu du mardi.
  #
  # Volontairement SANS --apply : la fusion supprime des lignes dépendantes
  # déjà présentes sur la fiche conservée (mandats, déclarations HATVP, articles
  # de presse). Le dry-run du 15/11/2026 annonçait 10 paires, 1121 lignes
  # déplacées et 129 supprimées, sur des fiches qui n'ont pas d'`an_id` — donc
  # pas les doublons AN/Sénat que merge-duplicate-officials.ts décrit. Tant que
  # cet écart n'est pas tranché, la fusion reste un geste manuel, à lancer
  # après relecture de la liste (voir docs/INGEST.md).
  - name: merge-duplicate-officials
    command: yarn --cwd packages/ingest merge:duplicate-officials
    depends:
      - ingestion-senat
    # Recensement en lecture seule : son échec ne doit pas faire échouer le run.
    continue_on:
      failure: true
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  # Dépend de l'ingestion, pas du recensement, qui n'écrit rien.
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-senat.json
    depends:
      - ingestion-senat
