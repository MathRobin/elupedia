# Cron documenté dans docs/INGESTION-SCHEDULE.md (créneau isolé, décalé de 4
# jours vs ingest-maires.yaml pour éviter toute contention sur officials/mandates).
name: ingest-membres-assemblee
description: Ingest — Membres assemblée statut particulier (RNE)
schedule: '0 22 5/5 * *'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock sh -c 'git fetch --no-write-fetch-head origin main && git merge --ff-only origin/main'
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: ingestion-membres-assemblee
    command: yarn --cwd packages/ingest ingest:membres-assemblee
    depends:
      - install-dependencies
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-membres-assemblee.json
    depends:
      - ingestion-membres-assemblee
