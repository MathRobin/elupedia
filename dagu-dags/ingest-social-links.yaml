# Généré automatiquement à partir de .github/workflows/ingest-social-links.yml
# Cron repris tel quel (UTC — GitHub Actions n'exécute qu'en UTC).
# Vérifier que Dagu/systemd interprète bien ce cron en UTC (TZ=UTC),
# sinon les horaires réels seront décalés par rapport au calendrier
# documenté dans docs/INGESTION-SCHEDULE.md.
name: ingest-social-links
description: Ingest — Liens sociaux
schedule: '30 3 * * 1'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock git pull
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: ingestion-liens-sociaux
    command: yarn --cwd packages/ingest ingest:social-links
    depends:
      - install-dependencies
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-social-links.json
    depends:
      - ingestion-liens-sociaux
