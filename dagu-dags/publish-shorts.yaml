# Publication YouTube de tous les shorts approuvés lors de la revue
# (packages/shorts), les plus anciens d'abord, toutes les heures. Cron en UTC —
# voir docs/INGESTION-SCHEDULE.md. Aucun accès aux tables d'ingestion.
# YOUTUBE_PRIVACY_STATUS et SHORTS_OUTPUT_DIR (optionnelles) ne sont pas déclarées
# ici : Dagu laisse « ${VAR} » littéral quand la variable est absente, et le
# script échouait sur « --privacy invalide ». Il lit lui-même le .env de la racine.
name: publish-shorts
description: Publish — Shorts YouTube approuvés, toutes les heures
schedule: '0 * * * *'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
  - YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
  - YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN}
steps:
  - name: git-pull
    command: git pull
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: publish-shorts
    command: yarn --cwd packages/shorts publish --max all
    depends:
      - install-dependencies
