# Cron documenté dans docs/INGESTION-SCHEDULE.md (créneau isolé, décalé de 2
# jours vs ingest-maires.yaml et de 1 jour vs ingest-conseillers-dep.yaml pour
# éviter toute contention sur officials/mandates).
name: ingest-conseillers-reg
description: Ingest — Conseillers régionaux (RNE)
schedule: '0 22 3/5 * *'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock sh -c 'git fetch --no-write-fetch-head origin main && git merge --ff-only origin/main'
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: ingestion-conseillers-reg
    command: yarn --cwd packages/ingest ingest:conseillers-reg
    depends:
      - install-dependencies
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-conseillers-reg.json
    depends:
      - ingestion-conseillers-reg
