# Cron documenté dans docs/INGESTION-SCHEDULE.md (créneau isolé, décalé de 3
# jours vs ingest-maires.yaml pour éviter toute contention sur officials/mandates).
name: ingest-conseillers-arr
description: Ingest — Conseillers d'arrondissement (RNE)
schedule: '0 22 4/5 * *'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock git pull
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: ingestion-conseillers-arr
    command: yarn --cwd packages/ingest ingest:conseillers-arr
    depends:
      - install-dependencies
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-conseillers-arr.json
    depends:
      - ingestion-conseillers-arr
