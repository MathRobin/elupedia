# Ingestion quotidienne des scrutins AN + Sénat (étapes `votes` et `senat-votes`
# seulement), pour disposer des votes récents sans attendre les passes complètes
# hebdomadaires (ingest-an le lundi, ingest-senat le mardi), puis génération du
# short vidéo du jour (packages/shorts) : sélection des scrutins candidats,
# script, voix off ElevenLabs, rendu. Les shorts sans voix (clé ElevenLabs
# absente, voix à enregistrer) ne sont pas rendus ; la revue humaine et la
# publication (publish-shorts, 16:00 UTC le lendemain) restent à part.
# Cron en UTC (17:00 = 18:00 Paris en hiver, 19:00 en été) — voir
# docs/INGESTION-SCHEDULE.md.
name: ingest-votes
description: Ingest — Votes AN + Sénat, puis short du jour
schedule: '0 17 * * *'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
  - ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  - ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
  - ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
  - ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID}
  - ELEVENLABS_SPEED: ${ELEVENLABS_SPEED}
  - SHORTS_OUTPUT_DIR: ${SHORTS_OUTPUT_DIR}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock sh -c 'git fetch --no-write-fetch-head origin main && git merge --ff-only origin/main'
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: votes-assemblee-nationale
    command: yarn --cwd packages/ingest ingest:an --only votes,ballot-proposers
    depends:
      - install-dependencies
  - name: votes-senat
    command: yarn --cwd packages/ingest ingest:senat --only senat-votes
    depends:
      - votes-assemblee-nationale
  - name: select-shorts
    command: yarn --cwd packages/shorts select
    depends:
      - votes-senat
  - name: script-shorts
    command: yarn --cwd packages/shorts script
    depends:
      - select-shorts
  - name: voiceover-shorts
    command: yarn --cwd packages/shorts voiceover generate
    depends:
      - script-shorts
  - name: render-shorts
    command: yarn --cwd packages/shorts render
    depends:
      - voiceover-shorts
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-an.json --report ingest-report-senat.json
    depends:
      - votes-senat
