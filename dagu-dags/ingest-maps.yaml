# Généré automatiquement à partir de .github/workflows/ingest-maps.yml
# Cron repris tel quel (UTC — GitHub Actions n'exécute qu'en UTC).
# Vérifier que Dagu/systemd interprète bien ce cron en UTC (TZ=UTC),
# sinon les horaires réels seront décalés par rapport au calendrier
# documenté dans docs/INGESTION-SCHEDULE.md.
name: ingest-maps
description: Ingest — Cartes statiques (S3)
schedule: '30 6 1 * *'
env:
  - DATABASE_URL: ${DATABASE_URL}
  - VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
  - MAPS_S3_BUCKET: ${MAPS_S3_BUCKET}
  - MAPS_S3_REGION: ${MAPS_S3_REGION}
  - MAPS_BASE_URL: ${MAPS_BASE_URL}
  - AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  - AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock git pull
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: generation-et-upload-des-cartes-statiques
    command: yarn --cwd packages/ingest ingest --only maps
    depends:
      - install-dependencies
  # Rebuild Vercel des pages statiques si l'ingestion a changé quelque chose
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report.json
    depends:
      - generation-et-upload-des-cartes-statiques
