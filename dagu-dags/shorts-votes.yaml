# Short vidéo sur les votes, sans ingestion : sélection des scrutins candidats
# déjà en base, script, voix off ElevenLabs, rendu. Reprend les étapes shorts
# de ingest-votes sans les étapes `votes` et `senat-votes`.
# Pas de planification : déclenchement manuel depuis l'interface Dagu.
# La revue humaine et la publication (publish-shorts) restent à part.
#
# Attention : rebuild-site lit les rapports ingest-report-an.json et
# ingest-report-senat.json laissés par la dernière ingestion, puisque ce DAG
# n'en produit aucun. Si ces rapports annoncent des changements, le deploy hook
# part (au plus une fois par 20 min) pour des données déjà publiées.
# Les variables optionnelles (VERCEL_DEPLOY_HOOK_URL, ELEVENLABS_MODEL_ID,
# ELEVENLABS_SPEED, SHORTS_OUTPUT_DIR) ne sont pas déclarées, comme dans
# ingest-votes.yaml et publish-shorts.yaml : Dagu laisse « ${VAR} » littéral
# quand la variable manque au .env, et cette valeur du shell prime sur le
# --env-file de tsx. Les scripts lisent eux-mêmes le .env de la racine.
name: shorts-votes
description: Shorts — Vidéo sur les votes, sans ingestion (déclenchement manuel)
env:
  - DATABASE_URL: ${DATABASE_URL}
  - ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  - ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
  - ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
steps:
  - name: git-pull
    command: flock /tmp/elupedia-git-pull.lock sh -c 'git fetch --no-write-fetch-head origin main && git merge --ff-only origin/main'
  - name: enable-corepack
    command: corepack enable
    depends:
      - git-pull
  - name: install-dependencies
    command: yarn install --immutable
    depends:
      - enable-corepack
  - name: select-shorts
    command: yarn --cwd packages/shorts select
    depends:
      - install-dependencies
  - name: script-shorts
    command: yarn --cwd packages/shorts script
    depends:
      - select-shorts
  - name: voiceover-shorts
    command: yarn --cwd packages/shorts voiceover generate
    depends:
      - script-shorts
  - name: render-shorts
    command: yarn --cwd packages/shorts render
    depends:
      - voiceover-shorts
  # Rebuild Vercel des pages statiques si un rapport d'ingestion a des changements
  # (utils/deploy-hook.ts : hook VERCEL_DEPLOY_HOOK_URL, 20 min minimum entre deux).
  - name: rebuild-site
    command: yarn --cwd packages/ingest rebuild:site --report ingest-report-an.json --report ingest-report-senat.json
    depends:
      - render-shorts
