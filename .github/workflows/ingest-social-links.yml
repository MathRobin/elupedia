name: Ingestion — liens sociaux

on:
#  schedule:
#    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.run.outputs.has_changes }}
      total_created: ${{ steps.run.outputs.total_created }}
      total_updated: ${{ steps.run.outputs.total_updated }}
      changed_sources: ${{ steps.run.outputs.changed_sources }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run social links ingestion
        id: run
        run: yarn workspace @elupedia/ingest ingest:social-links
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-social-links
          path: packages/ingest/ingest-report-social-links.json
          if-no-files-found: ignore

  deploy:
    needs: ingest
    if: needs.ingest.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run database migrations
        run: yarn db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build site
        run: yarn workspace @elupedia/site build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to production
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} packages/site/dist
