name: Scrape Social Links

on:
  schedule:
    # 03:00 UTC = 05:00 Paris (CEST) / 04:00 Paris (CET)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run social links scraping
        run: yarn workspace @elupedia/ingest scrape-social
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
