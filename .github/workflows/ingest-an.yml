name: Ingestion AN

on:
  schedule:
    - cron: '0 2 * * 2,6'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.run.outputs.has_changes }}
      total_created: ${{ steps.run.outputs.total_created }}
      total_updated: ${{ steps.run.outputs.total_updated }}
      changed_sources: ${{ steps.run.outputs.changed_sources }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ingestion AN
        id: run
        run: yarn workspace @elupedia/ingest ingest:an
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-an
          path: packages/ingest/ingest-report-an.json
          if-no-files-found: ignore

  deploy:
    needs: ingest
    if: needs.ingest.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run database migrations
        run: yarn db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
