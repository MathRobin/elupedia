name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  visual-regression:
    name: Régression visuelle (Playwright)
    runs-on: ubuntu-latest
    # Image officielle Playwright : même rendu de police que les baselines
    # committées (générées via cette même image, voir packages/e2e/README.md).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      pull-requests: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run visual regression tests
        id: visual
        working-directory: packages/e2e
        run: npx playwright test visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: packages/e2e/playwright-report/
          retention-days: 14

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ steps.visual.outcome }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = outcome === 'success'
              ? `✅ Régression visuelle : aucune différence détectée.`
              : `❌ Régression visuelle : des captures diffèrent des baselines.\n\nTélécharger le rapport (\`visual-regression-report\`) depuis [ce run](${runUrl}) pour voir le diff avant/après. Si le changement est voulu, régénère les baselines (voir packages/e2e/README.md) et committe-les.`;
            const marker = '<!-- visual-regression-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            const fullBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

  deploy:
    name: Déploiement Vercel
    needs: ci
    runs-on: ubuntu-latest
    # Seulement en production, sur push vers main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: npm install --global vercel@latest

      - name: Récupérer la configuration du projet
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Construire
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Déployer
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Déploiement production : $url" >> "$GITHUB_STEP_SUMMARY"
