name: Ingestion — presse maires

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run press ingestion (maires)
        id: run
        run: yarn workspace @elupedia/ingest ingest:press:maires
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-report-press-maires
          path: packages/ingest/ingest-report-press-maires.json
          if-no-files-found: ignore
