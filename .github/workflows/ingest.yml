name: Ingestion

on:
  schedule:
    # 02:00 UTC = 04:00 Paris (CEST) / 03:00 Paris (CET)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ingestion
        run: yarn workspace @elupedia/ingest ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
